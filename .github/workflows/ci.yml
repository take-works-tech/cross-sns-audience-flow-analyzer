name: CI
on:
  push:
  pull_request:
  merge_group:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # npm workspaces: one install at the root covers every package (apps/web today).
      #
      # The lockfile is committed for local use, but it is NOT installed from here. npm records
      # only the host platform's native optional packages in the lockfile (npm/cli#4828), and it
      # is written on Windows, so installing from it on Linux yields a tree whose rolldown,
      # lightningcss, oxide and swc have no binding - every one of them fails at run time.
      # Resolving fresh is the documented way out. The cost is that transitive `^` ranges float
      # on CI, so a dependency release can turn this red without a commit; the fix, when it
      # matters enough, is a package manager whose lockfile is platform-complete (pnpm).
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      # Self-test for generated hooks (dot-dirs are not collected by pytest default, so run explicitly)
      - run: python -m unittest discover -s .claude/hooks -p "test_*.py" -v
      # Reference integrity: every .claude artifact named by an instruction file must exist, and
      # every hook must be registered. Catches "deleted it, but the references stayed" — which
      # raises no error at runtime, it just quietly instructs the agent to use something gone.
      - run: python scripts/validate/check_env_references.py
      # Instruction-context budget: the always-injected layer is paid on every turn of every
      # session, and it only ever grows. Both layers are charged, so path-scoping a rule is a trade
      # between them rather than a way to make the number fall.
      - run: python scripts/validate/check_context_budget.py
      # Single source of truth: the same constant defined twice is the defect that survives review,
      # because both definitions look right until one of them is edited.
      - run: python scripts/validate/check_constant_duplication.py
      # Ownership and dependency direction. Inert until the project declares its module map, and it
      # says so rather than printing success over an unconfigured check; the script names the file.
      - run: python scripts/validate/check_module_ownership.py
      # Lint and type gate, delegated to each workspace so the root stays config-free.
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests (vitest, in apps/web). The end-to-end suite runs in visual.yml,
      # which is the only job that needs a browser and a running dev server.
      - run: npm test
      # The build is a gate too: a type-clean app can still fail to compile.
      - run: npm run build
