name: Claude Code Review
# Automated PR review by Claude (anthropics/claude-code-action).
# Required secret: CLAUDE_CODE_OAUTH_TOKEN (Pro/Max subscription; issue via `claude setup-token` — no extra charges).
#   To use pay-as-you-go instead, replace claude_code_oauth_token with anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
#   (opt-in). Without it configured, the PR check will fail. If you don't need this, delete the file or use setup-env --no-claude-review.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # required to post review comments
      issues: write         # required to post comments
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: 'true'
          # Model strategy (selectable): default = Opus for the first run / Sonnet for subsequent pushes (synchronize)
          # (RouteLLM: ~95% quality at roughly -85% cost). Can also be switched to opus-only or sonnet-only
          # (setup-env practices ci-review-model=opus|sonnet|opus-first).
          claude_args: |
            --model ${{ github.event.action == 'synchronize' && 'sonnet' || 'opus' }}
            --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)"
          prompt: |
            Read and follow .claude/agents/code-reviewer-ci.md if present.
            Review this pull request for correctness, security, and maintainability.
            Read CLAUDE.md and .claude/rules/ for project rules and coding standards before reviewing.

            COVERAGE PRIORITY (Opus 4.x harness instruction):
            Report ALL issues you find, including uncertain or low-severity ones. Do NOT filter by
            importance or confidence at this detection stage. Attach [confidence: High/Medium/Low] and
            an estimated severity to each finding so downstream can rank them. It is better to surface a
            finding that gets filtered later than to silently drop a real bug. "Complex" or "uncertain"
            is NEVER a reason to skip — attach [confidence: Low] and still report.

            APPLY-TO-ALL SCOPE (Opus 4.x literal-interpretation guard):
            Apply EVERY review perspective to EVERY changed file in this PR. Do not narrow the scope to
            "the obvious file" or "the first matching perspective". Walk each file against each perspective.
            State "N/A" explicitly when a perspective truly does not apply.

            Report findings by severity (Critical / High / Medium / Best Practices) and cite file:line.
            Approve only when no Critical, High, or Medium issues remain.
            Include the evaluated commit SHA (${{ github.event.pull_request.head.sha }}) in your comment header.

      # Silent-failure guard: anthropics/claude-code-action@v1 tightened default
      # allowedTools around 2026-06-25 -> Bash `gh` calls used for sticky-comment
      # posting can be denied silently. SDK finishes with `is_error: false` yet no
      # comment is posted and the workflow reports success. Inspect the execution
      # file and fail the job when either is_error=true or num_turns<=1.
      - name: Guard against silent success
        if: always() && steps.claude-review.outcome == 'success'
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::warning::execution_file not available; skipping silent-failure guard."
            exit 0
          fi
          python3 -c '
          import json, os, sys
          with open(os.environ["EXECUTION_FILE"], encoding="utf-8") as f:
              messages = json.load(f)
          result = next((m for m in reversed(messages) if isinstance(m, dict) and m.get("type") == "result"), None)
          if result is None:
              print("::warning::result entry not found; skipping guard.")
              sys.exit(0)
          is_error = bool(result.get("is_error"))
          num_turns = int(result.get("num_turns", 0))
          print(f"is_error={is_error} num_turns={num_turns}")
          if is_error:
              print("::error::Claude SDK reported is_error=true. Review was NOT posted.")
              sys.exit(1)
          if num_turns <= 1:
              print(f"::error::Claude SDK exited after {num_turns} turn(s) — likely auth/quota failure.")
              sys.exit(1)
          '
