name: visual

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deterministic Playwright visual regression — no LLM in CI (Playwright MCP is dev-time only).
# See docs at .claude/skills/webapp-testing/SKILL.md.

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium only — keep CI light)
        run: npx playwright install --with-deps chromium

      - name: Run visual regression suite
        env:
          CI: "true"
        run: npx playwright test --project=chromium --reporter=github

      - name: Upload HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-failures
          path: |
            test-results/
            tests/__screenshots__/
          retention-days: 7
