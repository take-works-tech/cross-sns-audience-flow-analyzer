# Codex CLI project configuration for cross-sns-audience-flow-analyzer — generated by cckit.
# Reference: https://learn.chatgpt.com/docs/config-file/config-reference
#
# Instructions: AGENTS.md at the repository root. Codex reads it natively and merges every
# AGENTS.md from the git root down to the working directory, deepest file winning on conflicts.
# Claude Code reads the same file through the `@AGENTS.md` import in CLAUDE.md — one source, two
# tools, no drift.
#
# Skills: .claude/skills/**/SKILL.md uses the shared Agent Skills format, which Codex reads too.
# Codex resolves skills from ~/.codex/skills/, not from the project, so link them once per machine:
#   ln -s "$PWD/.claude/skills/<name>" ~/.codex/skills/<name>          # macOS / Linux
#   New-Item -ItemType SymbolicLink ~\.codex\skills\<name> -Target .claude\skills\<name>   # Windows
# Skills carrying a Claude-Code-only frontmatter key still load in Codex, but they are rejected by
# claude.ai upload / the Skills API. `cckit verify-skills --require-portable` reports which ones.
#
# `model` is deliberately NOT pinned: Codex ships its own current default, and a stale pin silently
# downgrades every session. Set it only when a model must be frozen:
#   model = "<model id from the Codex docs>"

# Reasoning depth, from the same model policy that drives the Claude agents. Codex's ladder is
# minimal|low|medium|high|xhigh — there is no `max`.
model_reasoning_effort = "high"

# Execution posture, mirroring the deny-by-default permission model in .claude/settings.json:
# the agent may edit its own workspace; anything outside it, and any network egress, needs a human.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[tools]
web_search = true

# --- Lifecycle hooks -------------------------------------------------------------------------
# Codex uses the same event names as Claude Code (PreToolUse, PostToolUse, SessionStart,
# SessionEnd, UserPromptSubmit, Stop, ...), so the generated .claude/hooks/ scripts are reused
# verbatim rather than forked: one script, one behaviour, one place to fix.
#
# Only hooks whose wiring is verifiable from the published reference are enabled below. A
# tool-matched hook (the PreToolUse suppression guard, for example) needs a matcher whose exact
# TOML key this generator cannot confirm offline, so it ships commented out rather than guessed —
# a hook wired wrong is worse than one not wired, because it looks enforced and is not.
# TODO: uncomment after checking the matcher key in the reference above, then verify by running
#       Codex once and confirming the guard actually fires on an Edit.
#
# [[hooks.PreToolUse]]
# matcher = "Edit|Write"
# [[hooks.PreToolUse.hooks]]
# type = "command"
# command = "python .claude/hooks/suppression-guard.py"

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "bash .claude/hooks/session-init.sh"
commandWindows = "bash .claude/hooks/session-init.sh"
